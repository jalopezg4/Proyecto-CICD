# SonarCloud (paso 7). Proyecto creado desde la cuenta de GitHub dueña del repo, con el
# análisis automático APAGADO (el análisis lo hace el CI).
sonar.projectKey=jalopezg4_Proyecto-CICD
sonar.organization=jalopezg4-1
sonar.python.version=3.13

# SonarCloud usa el "nuevo alcance de análisis": analiza todo el repo, detecta solo los módulos
# backend/ y frontend/, e ignora sonar.sources y sonar.tests. Por eso aquí solo se excluye.
sonar.exclusions=**/*.md,docs/**,.github/**,frontend/static/**

# Cobertura: los reportes se buscan desde la raíz del repo.
sonar.python.coverage.reportPaths=backend/coverage.xml,frontend/coverage.xml
# Fuera del cálculo de cobertura:
#  - pruebas (tests, smoke y e2e): son código de prueba, no código a cubrir
#  - frontend/main.py: la UI de NiceGUI se cubre con las E2E de Playwright
#    (se repite como "main.py" porque dentro del módulo frontend la ruta es relativa a él)
sonar.coverage.exclusions=**/tests/**,**/test_*.py,smoke/**,e2e/**,frontend/main.py,main.py
# Ojo: en el módulo frontend SonarCloud toma las exclusiones de frontend/.coveragerc (omit).

# Reportes por módulo: estas rutas se resuelven dentro de backend/ y de frontend/,
# y el CI deja un junit.xml y un bandit-report.json en cada uno.
sonar.python.xunit.reportPath=junit.xml
sonar.python.bandit.reportPaths=bandit-report.json

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
