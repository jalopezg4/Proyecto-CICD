# SonarCloud (paso 7). Proyecto creado desde la cuenta de GitHub dueña del repo, con el
# análisis automático APAGADO (el análisis lo hace el CI).
sonar.projectKey=jalopezg4_Proyecto-CICD
sonar.organization=jalopezg4-1
sonar.python.version=3.13

# Código de los dos componentes (sin pruebas)
sonar.sources=backend/app,frontend
sonar.exclusions=frontend/tests/**,frontend/static/**,**/*.md,docs/**,.github/**
sonar.tests=backend/tests,frontend/tests,e2e,smoke
sonar.test.inclusions=backend/tests/**,frontend/tests/**,e2e/**,smoke/**

# Cobertura y reportes generados en el job "calidad"
sonar.python.coverage.reportPaths=backend/coverage.xml,frontend/coverage.xml
sonar.python.xunit.reportPath=backend/junit.xml,frontend/junit.xml
sonar.python.bandit.reportPaths=bandit-report.json
# La UI de NiceGUI (frontend/main.py) se cubre con las E2E de Playwright, no con pruebas unitarias
sonar.coverage.exclusions=frontend/main.py

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
