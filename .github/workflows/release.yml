# Release a producción por tag (paso 11 del plan).
#
# Se dispara al crear un tag vX.Y.Z (git tag v1.0.0 && git push origin v1.0.0):
#   verificar            → el commit del tag está en main y es lo que staging tiene como last-good
#                          (solo se libera lo que ya pasó todas las pruebas en staging)
#   promover             → en ECR, el MISMO digest de sha-<commit> recibe también el tag vX.Y.Z
#                          (no se vuelve a construir nada: D5)
#   desplegar-produccion → aprobación del environment "production" (otra persona del equipo) y
#                          terraform apply en el workspace "production"
#   smoke-produccion     → espera /health con vX.Y.Z y corre el smoke de solo lectura; si pasa,
#                          vX.Y.Z queda como last-good de producción (base del rollback, paso 13)
#   rollback-produccion  → paso 13, nivel 2 del rollback (D8): si el smoke falla pero el deploy sí
#                          quedó estable, vuelve al last-good anterior y repite el smoke. Sin
#                          aprobación nueva: ya se aprobó este release, y volver a una versión que
#                          ya pasó todas las pruebas no es un despliegue nuevo que aprobar.
#
# Requiere los mismos secrets y la variable TF_STATE_BUCKET que el CD de staging.
name: Release producción

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Un solo despliegue a producción a la vez; uno nuevo espera (nunca se corta un apply).
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.17.1'
  TAG: ${{ github.ref_name }}
  # La imagen que ya probó staging, identificada por el commit del tag
  IMAGEN_STAGING: sha-${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Solo se libera lo que staging ya probó
  # ---------------------------------------------------------------------------
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: El tag apunta a un commit de main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag $TAG apunta a un commit que no está en main"; exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: La versión pasó staging (last-good)
        run: |
          LAST_GOOD=$(aws ssm get-parameter --name /gastico/staging/last-good --query Parameter.Value --output text)
          if [ "$LAST_GOOD" != "$IMAGEN_STAGING" ]; then
            echo "::error::El commit del tag ($IMAGEN_STAGING) no es el last-good de staging ($LAST_GOOD). Pongan el tag sobre el commit que pasó staging, o esperen a que el CD de staging termine en verde."
            exit 1
          fi
          echo "$IMAGEN_STAGING pasó staging: se libera como $TAG"

  # ---------------------------------------------------------------------------
  # 2. Promoción inmutable: el mismo digest recibe el tag de versión
  # ---------------------------------------------------------------------------
  promover:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Se copia el manifiesto de sha-<commit> a vX.Y.Z: misma imagen, mismo digest.
      # Los tags de ECR son inmutables, así que si vX.Y.Z ya existe se verifica que sea el mismo.
      - name: Tag vX.Y.Z en ECR (mismo digest que staging)
        run: |
          {
            echo "### Promoción $IMAGEN_STAGING → $TAG"
            echo "| Repositorio | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for repo in gastico-backend gastico-frontend; do
            digest=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$IMAGEN_STAGING" \
              --query 'imageDetails[0].imageDigest' --output text)
            existente=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            if [ -n "$existente" ] && [ "$existente" != "None" ]; then
              if [ "$existente" != "$digest" ]; then
                echo "::error::$repo:$TAG ya existe con otro digest ($existente); los tags son inmutables"; exit 1
              fi
              echo "$repo:$TAG ya apunta al mismo digest"
            else
              # El manifiesto se pasa por archivo, byte a byte: si se reformatea (espacios, saltos
              # de línea), ECR calcula otro digest y ya no sería la misma imagen que probó staging.
              aws ecr batch-get-image --repository-name "$repo" --image-ids imageTag="$IMAGEN_STAGING" \
                --output json > imagen.json
              python3 -c "import json; i = json.load(open('imagen.json'))['images'][0]; open('manifiesto.json', 'w', newline='').write(i['imageManifest']); print(i['imageManifestMediaType'], end='')" > tipo.txt
              aws ecr put-image --repository-name "$repo" --image-tag "$TAG" \
                --image-manifest file://manifiesto.json --image-manifest-media-type "$(cat tipo.txt)" >/dev/null
              promovido=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" \
                --query 'imageDetails[0].imageDigest' --output text)
              if [ "$promovido" != "$digest" ]; then
                echo "::error::$repo:$TAG quedó con otro digest ($promovido ≠ $digest)"; exit 1
              fi
              echo "$repo: $IMAGEN_STAGING → $TAG (mismo digest)"
            fi
            echo "| $repo | \`$digest\` |" >> "$GITHUB_STEP_SUMMARY"
          done

  # ---------------------------------------------------------------------------
  # 3. Despliegue a producción, con aprobación manual
  # ---------------------------------------------------------------------------
  desplegar-produccion:
    needs: promover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Revisores obligatorios: otra persona del equipo aprueba (quien crea el tag no puede)
    environment:
      name: production
      url: ${{ steps.salidas.outputs.frontend_url }}
    outputs:
      frontend_url: ${{ steps.salidas.outputs.frontend_url }}
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # wait_for_steady_state hace fallar el apply si ECS no estabiliza la versión (rollback nivel 1)
      - name: Terraform apply (production)
        run: |
          terraform init -input=false -backend-config=backend.hcl -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform workspace select -or-create production
          terraform apply -input=false -auto-approve \
            -var="backend_image_tag=$TAG" -var="frontend_image_tag=$TAG" -var="app_version=$TAG"

      - name: Outputs and SSM current
        id: salidas
        run: |
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          aws ssm put-parameter --name "$(terraform output -raw ssm_current_name)" \
            --value "$TAG" --type String --overwrite >/dev/null

  # ---------------------------------------------------------------------------
  # 4. Smoke post-producción (solo lectura: nunca crea ni borra gastos)
  # ---------------------------------------------------------------------------
  smoke-produccion:
    needs: desplegar-produccion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ needs.desplegar-produccion.outputs.frontend_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Wait for the new version
        run: |
          for i in $(seq 1 30); do
            if curl -sf "$BASE_URL/health" | grep -q "\"version\":\"$TAG\""; then
              echo "Producción responde con $TAG"; exit 0
            fi
            echo "Intento $i: todavía no está $TAG; espero 10 s"; sleep 10
          done
          echo "::error::Producción no quedó con la versión $TAG a tiempo"; exit 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Smoke (8.1 y 8.2, solo lectura)
        env:
          SMOKE_BASE_URL: ${{ env.BASE_URL }}
          SMOKE_VERSION: ${{ env.TAG }}
        run: |
          pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          python -m pytest smoke -v

      - name: Configure AWS credentials
        if: always()
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Solo una versión que pasó el smoke queda como last-good de producción.
      # Si el smoke falla, el rollback automático (paso 13) vuelve a este last-good.
      - name: SSM last-good
        run: |
          aws ssm put-parameter --name /gastico/production/last-good \
            --value "$TAG" --type String --overwrite >/dev/null

      - name: AWS evidence (resumen del run)
        if: always()
        run: bash .github/scripts/evidencia-aws.sh production "$TAG" "$BASE_URL" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 5. Rollback automático en producción (nivel 2, D8): igual que en staging, pero si el deploy
  # ya quedó estable y el smoke de producción falla, vuelve al last-good anterior.
  # ---------------------------------------------------------------------------
  rollback-produccion:
    needs: [desplegar-produccion, smoke-produccion]
    if: ${{ failure() && needs.desplegar-produccion.result == 'success' && needs.smoke-produccion.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Last-good de producción
        id: last_good
        run: |
          VERSION=$(aws ssm get-parameter --name /gastico/production/last-good --query Parameter.Value --output text)
          echo "Volviendo a $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Volver al last-good (mismo terraform, D9)
        id: rollback
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: bash .github/scripts/rollback.sh production "${{ steps.last_good.outputs.version }}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Repetir el smoke contra el last-good
        env:
          SMOKE_BASE_URL: ${{ steps.rollback.outputs.frontend_url }}
          SMOKE_VERSION: ${{ steps.last_good.outputs.version }}
        run: |
          pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          python -m pytest smoke -v

      - name: AWS evidence (resumen del run)
        if: always()
        run: |
          bash .github/scripts/evidencia-aws.sh production "${{ steps.last_good.outputs.version }}" \
            "${{ steps.rollback.outputs.frontend_url }}" >> "$GITHUB_STEP_SUMMARY"
