# CI de Gastico (pasos 3 y 7 del plan).
# Corre en cada PR hacia main, en cada push a main y manualmente.
#
#   calidad   → pre-commit, seguridad (Bandit, pip-audit, Checkov), pruebas con cobertura y SonarCloud
#   imagenes  → build de las 2 imágenes, Trivy, y E2E contra docker compose
#   ci        → resume los dos anteriores. Es el check obligatorio del ruleset proteger-main:
#               no cambiar su nombre.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un PR solo necesita la última ejecución: si llega un push nuevo, se cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Estáticas, seguridad del código y pruebas unitarias/componente
  # ---------------------------------------------------------------------------
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarCloud usa el historial para saber qué código es nuevo

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Lo necesitan los hooks terraform_fmt y terraform_validate de pre-commit (infra/)
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false

      - name: Install tools and dependencies (versiones fijas con hash)
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
          pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          pip install --require-hashes --only-binary=:all: -r frontend/requirements-dev.txt
          npm ci --prefix e2e

      # --- Estáticas ---

      - name: Pre-commit (ruff, eslint, prettier, gitleaks, terraform)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Bandit (SAST)
        run: bandit -r backend/app frontend smoke -x frontend/tests -ll

      - name: pip-audit (vulnerabilidades en dependencias)
        run: |
          pip-audit --strict --no-deps --disable-pip -r backend/requirements.txt
          pip-audit --strict --no-deps --disable-pip -r frontend/requirements.txt

      - name: Checkov (IaC)
        if: hashFiles('infra/**/*.tf') != ''
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra
          framework: terraform
          quiet: true
          # Checks que no aplican en el Learner Lab, cada uno justificado en el archivo
          config_file: .checkov.yaml

      # --- Unitarias y de componente con cobertura mínima del 80 % ---

      - name: Backend tests
        working-directory: backend
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml

      - name: Frontend tests
        working-directory: frontend
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml

      # --- SonarCloud ---

      # Un reporte por módulo, con rutas relativas a cada uno (así los resuelve SonarCloud)
      - name: Bandit reports for SonarCloud
        run: |
          (cd backend && bandit -r app -f json -o bandit-report.json --exit-zero)
          (cd frontend && bandit -r . -x ./tests,./.venv -f json -o bandit-report.json --exit-zero)

      # Obligatorio: si falta el secret SONAR_TOKEN, este paso falla y el CI queda en rojo.
      # El token solo se pasa a este paso, no a todo el job.
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reportes-calidad
          path: |
            backend/coverage.xml
            frontend/coverage.xml
            backend/junit.xml
            frontend/junit.xml
            backend/bandit-report.json
            frontend/bandit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Imágenes: build, escaneo de vulnerabilidades e integración en contenedores
  # ---------------------------------------------------------------------------
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      APP_VERSION: sha-${{ github.sha }}
      # Sin attestations de buildx: la imagen queda como un solo manifiesto que ECR sí puede escanear
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build images
        run: docker compose build

      - name: Trivy (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastico-backend:${{ env.IMAGE_TAG }}
          version: v0.76.2
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gastico-frontend:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          skip-setup-trivy: true

      - name: Start app (docker compose)
        run: docker compose up -d --wait

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: E2E (Playwright contra los contenedores)
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
          npm test --prefix e2e

      # --- Release: el artefacto que el CD despliega es exactamente esta imagen ya probada ---
      # Solo en main. Se guarda como artefacto del run (no se vuelve a construir en el CD), así
      # lo que llega a staging y a producción es, por digest, lo que pasó Trivy y las E2E.
      # (El smoke no corre aquí: su lugar es después de cada despliegue, en el CD y el release.)
      - name: Save tested images (release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "gastico-backend:${IMAGE_TAG}" "gastico-frontend:${IMAGE_TAG}" | gzip > imagenes.tar.gz

      - name: Upload release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: imagenes
          path: imagenes.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Container logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Check obligatorio: pasa solo si calidad e imagenes pasaron
  # ---------------------------------------------------------------------------
  ci:
    name: ci
    if: always()
    needs: [calidad, imagenes]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          echo "calidad: ${{ needs.calidad.result }} · imagenes: ${{ needs.imagenes.result }}"
          test "${{ needs.calidad.result }}" = "success" && test "${{ needs.imagenes.result }}" = "success"
