# CI base de Gastico (paso 3 del plan).
# Corre en cada PR hacia main y en cada push a main. El job se llama "ci" porque
# es el check obligatorio del ruleset proteger-main: no cambiar el nombre.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un PR solo necesita la última ejecución: si llega un push nuevo, se cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # --- Estáticas: los mismos hooks que corre cada integrante antes del commit ---

      - name: Install e2e dependencies (eslint y prettier)
        run: npm ci --prefix e2e

      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      # --- Pruebas unitarias y de componente con cobertura mínima del 80 % ---

      - name: Install Python dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt pytest pytest-cov

      - name: Backend tests
        working-directory: backend
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Frontend tests
        working-directory: frontend
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage.xml
          if-no-files-found: ignore
